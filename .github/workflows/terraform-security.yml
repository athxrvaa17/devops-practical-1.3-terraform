
name: Terraform Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform-security:
    name: Terraform Validation and Security Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Security Tools
        run: pip install checkov "python-hcl2==8.2.0"

      - name: Run Full Checkov Security Audit
        continue-on-error: true
        run: |
          set -o pipefail
          checkov -d . --framework terraform --output cli 2>&1 | tee reports/checkov-ci.txt

      - name: Run Mandatory Custom Guardrails
        run: python policies/guardrails.py

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-security-reports
          path: reports/*.txt
          if-no-files-found: warn

